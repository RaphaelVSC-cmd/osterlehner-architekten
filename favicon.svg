<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="oaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#325244" />
      <stop offset="100%" stop-color="#1E342B" />
    </linearGradient>
  </defs>
  <!-- Background Canvas -->
  <rect width="64" height="64" rx="14" fill="#17191A" />
  
  <!-- Subtle Blueprint Grid Lines -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="rgba(243, 239, 234, 0.12)" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="32" y1="8" x2="32" y2="56" stroke="rgba(243, 239, 234, 0.12)" stroke-width="1" stroke-dasharray="2,2" />

  <!-- Architectural Structure / Monogram O-A -->
  <!-- Outer Tectonic Cube in Patinated Copper Green -->
  <rect x="14" y="14" width="36" height="36" rx="4" fill="none" stroke="url(#oaGrad)" stroke-width="3" />
  
  <!-- Inner Section / Core Mass -->
  <rect x="22" y="22" width="20" height="20" rx="2" fill="#325244" opacity="0.4" />
  
  <!-- Red Ochre / Rötel Cut-Axis & Precision Crosshair -->
  <line x1="10" y1="22" x2="54" y2="22" stroke="#B64F37" stroke-width="1.75" />
  <line x1="42" y1="10" x2="42" y2="54" stroke="#B64F37" stroke-width="1.75" />
  
  <!-- Precision Center Point -->
  <circle cx="42" cy="22" r="2.5" fill="#B64F37" />
  <circle cx="42" cy="22" r="4.5" fill="none" stroke="#F3EFEA" stroke-width="0.75" opacity="0.8" />
</svg>
